# Render Blueprint: 抖音花园 MVP 后端部署配置
# 文档: https://docs.render.com/blueprint-spec

services:
  # FastAPI Web Service
  - type: web
    name: flowers-api
    runtime: python
    plan: free
    region: singapore           # 离中国大陆最近，延迟最低
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # 数据库：Render Free 无持久化卷，每次部署会重置；Hobby ($5/月) 可加 disk 持久化
      - key: FLOWERS_DATABASE_URL
        value: sqlite:///tmp/flowers.db
      # AI 模型配置（从 .env.example 迁移；部署前在 Render Dashboard → Environment 填入真实值）
      - key: AI_PROVIDER
        value: mock               # 首次部署先用 mock 确保跑通；确认后端正常后改为 ark
      - key: ARK_API_KEY
        sync: false               # 敏感信息：在 Render Dashboard 手动设置，不同步到 repo
      - key: ARK_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: ARK_CHAT_MODEL
        value: doubao-seed-2-1-turbo-260628
      - key: ARK_IMAGE_MODEL
        value: doubao-seedream-5-0-pro-260628
      # Python 运行时
      - key: PYTHON_VERSION
        value: 3.13
    healthCheckPath: /api/v1/gardens/1
    # 自动部署：main 分支 push 时自动重新构建
    autoDeploy: true
