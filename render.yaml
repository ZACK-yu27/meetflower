# Render Blueprint: 抖音花园 MVP 后端部署配置
# 文档: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: flowers-api
    runtime: python
    plan: free
    region: singapore
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FLOWERS_DATABASE_URL
        value: sqlite:////tmp/flowers.db
      - key: AI_PROVIDER
        value: mock
      - key: ARK_API_KEY
        sync: false
      - key: ARK_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: ARK_CHAT_MODEL
        value: doubao-seed-2-0-lite-260215
      - key: ARK_IMAGE_MODEL
        value: doubao-seedream-5-0-260128
      # 后端公网地址（静态资源 URL 前缀，前端与 API 不同域时必填）：
      # 部署后 Render 实际分配的域名（可能带随机后缀，以 Dashboard 为准），如 https://flowers-api-ab12.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
    healthCheckPath: /api/v1/gardens/1
    autoDeploy: true
