# Render Blueprint: 抖音花园 MVP 后端部署配置
# 文档: https://docs.render.com/blueprint-spec

services:
  # FastAPI Web Service
  - type: web
    name: flowers-api
    runtime: python
    plan: free
    region: oregon
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # 数据库：放在项目目录内，确保有写入权限
      - key: FLOWERS_DATABASE_URL
        value: sqlite:///flowers.db
      # AI 模型配置（部署前在 Render Dashboard → Environment 填入真实 ARK_API_KEY）
      - key: AI_PROVIDER
        value: mock
      - key: ARK_API_KEY
        sync: false
      - key: ARK_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: ARK_CHAT_MODEL
        value: doubao-seed-2-1-turbo-260628
      - key: ARK_IMAGE_MODEL
        value: doubao-seedream-5-0-pro-260628
    healthCheckPath: /api/v1/gardens/1
    autoDeploy: true
